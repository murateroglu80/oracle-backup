# ============================================================
# secrets/vault.yaml — CREDENTIALS_CONFIG.provider: "vault" iken (spec §2.2)
# Bu dosyayı 'vault.yaml' olarak kopyalayın. .gitignore'dadır; `chmod 600` önerilir.
# Anahtar = instance_id (config'teki resolved instance_id ile birebir aynı olmalı).
# ============================================================

VAULT_INSTANCES:
  db-server1.example.local_orcl1:
    url: "https://vault.example.local:8200"
    token: "s.XXXXXXXXXXXXXXXX"
    secret_path: "secret/data/oracle/smtp"        # SMTP parolası (smtp_password veya password anahtarı)
    db_secret_path: "secret/data/oracle/orcl1"    # DB credential (username/password/hostname/db anahtarları)

  db-server1.example.local_prod2:
    url: "https://vault.example.local:8200"
    token: "s.YYYYYYYYYYYYYYYY"
    secret_path: "secret/data/oracle/smtp"
    db_secret_path: "secret/data/oracle/prod2"
